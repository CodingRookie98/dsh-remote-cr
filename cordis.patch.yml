# dsh-remote-cr 的 bundle 补丁：往 profile 的行表里插一行宿主半。
#
# 这一行是「一切的前提」：官方 `client-modules` 只扫描 **Loader 已有的行**，
# 行不存在时 `dsh.client` 声明根本不会被读到，浏览器半也就永远不会被加载
# （`packages/client/modules/src/index.ts:844-879 resolveMeta`）。
#
# `name` 写包名而不是相对路径：包名让 Loader 走自己的模块解析，安装位置变了也
# 不用改补丁；相对路径会被 `anchorInsertedPluginNames` 转成 `file://` URL 并钉死
# 在补丁文件所在目录（`packages/boot/app-boot/src/index.ts:551`）。

- insert:
    - id: teleport
      name: 'dsh-remote-cr'
